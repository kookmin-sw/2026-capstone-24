# EC2 control-plane 전용 compose — spring + mariadb.
# room-server (ECS Fargate task) 는 본 compose 에 포함하지 않는다 (Spring 내부
# RoomServerManager 가 AWS API 로 on-demand 실행).
#
# 사용법: docs/ops/aws-dev-runbook.md 참조
# 환경변수: EC2 인스턴스의 ~/.env.aws-dev 에 정의 (.env.aws-dev.example 복사 후 채움)
services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - /var/backups/mariadb:/var/backups/mariadb
    # 외부 비공개 — host 포트를 노출하지 않는다 (Spring 컨테이너만 internal network 로 접근).
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  spring:
    build:
      context: backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Spring stdout/stderr 를 CloudWatch Logs 로 직접 송출. EC2 IAM Instance Profile 의
    # CloudWatchLogsFullAccess 가 PutLogEvents 권한을 제공한다. 본 driver 로 전환되면
    # `docker logs` 는 동작하지 않으므로 운영자는 CloudWatch console 또는
    # `aws logs tail /ec2/murang-spring` 으로 확인한다.
    logging:
      driver: awslogs
      options:
        awslogs-region: ${MURANG_AWS_REGION:-ap-northeast-2}
        awslogs-group: ${MURANG_SPRING_LOG_GROUP:-/ec2/murang-spring}
        awslogs-create-group: "true"
        awslogs-stream: spring
    environment:
      SPRING_PROFILES_ACTIVE: aws-dev
      # datasource — aws-dev 프로파일의 DB_URL 을 컨테이너 호스트명으로 override
      DB_URL: jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE}?sslMode=disable
      DB_USERNAME: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      # JWT
      MURANG_JWT_SECRET: ${JWT_SECRET}
      # Meta verifier (aws-dev 에서는 기본 real)
      MURANG_META_VERIFIER_MODE: ${MURANG_META_VERIFIER_MODE:-real}
      MURANG_META_APP_ID: ${MURANG_META_APP_ID}
      MURANG_META_APP_SECRET: ${MURANG_META_APP_SECRET}
      MURANG_META_GRAPH_BASE_URL: ${MURANG_META_GRAPH_BASE_URL:-https://graph.oculus.com}
      # Room internal callback (EC2 public DNS or static IP)
      MURANG_ROOM_INTERNAL_CALLBACK_BASE_URL: ${MURANG_ROOM_INTERNAL_CALLBACK_BASE_URL}
      MURANG_ROOM_INTERNAL_CALLBACK_SHARED_SECRET: ${MURANG_ROOM_INTERNAL_CALLBACK_SHARED_SECRET}
      # ECS runtime — Spring RoomServerManager 가 RunTask/StopTask/DescribeTasks 로 사용
      MURANG_ROOM_RUNTIME_ECS_REGION: ${MURANG_ROOM_RUNTIME_ECS_REGION:-ap-northeast-2}
      MURANG_ROOM_RUNTIME_ECS_CLUSTER: ${MURANG_ROOM_RUNTIME_ECS_CLUSTER}
      MURANG_ROOM_RUNTIME_ECS_TASK_DEFINITION_FAMILY: ${MURANG_ROOM_RUNTIME_ECS_TASK_DEFINITION_FAMILY}
      MURANG_ROOM_RUNTIME_ECS_SUBNET_IDS: ${MURANG_ROOM_RUNTIME_ECS_SUBNET_IDS}
      MURANG_ROOM_RUNTIME_ECS_SECURITY_GROUP_IDS: ${MURANG_ROOM_RUNTIME_ECS_SECURITY_GROUP_IDS}
      MURANG_ROOM_RUNTIME_ECS_CONTAINER_NAME: ${MURANG_ROOM_RUNTIME_ECS_CONTAINER_NAME:-room-server}
      MURANG_ROOM_RUNTIME_ECS_ASSIGN_PUBLIC_IP: ${MURANG_ROOM_RUNTIME_ECS_ASSIGN_PUBLIC_IP:-true}
      # AWS 자격증명은 EC2 IAM Instance Profile 로 주입 — 컨테이너 안에선 AWS SDK 가 instance metadata
      # 로 자동 획득. 별도 키 주입 필요 없음.
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb-data:
